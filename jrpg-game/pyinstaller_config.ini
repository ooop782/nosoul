# PyInstaller 打包設定檔
# 使用方式：pyinstaller --onefile --windowed --name="日式RPG冒險" --icon=game_icon.ico run.py

[DEFAULT]
# 遊戲名稱
name = 日式 RPG 冒險

# 版本
version = 1.0.0

# 描述
description = 一款使用 Python 和 Pygame 開發的日式角色扮演遊戲

# 作者
author = JRPG Developer

[Build]
# 是否創建單一可執行文件
onefile = True

# 是否隱藏控制台視窗 (Windows)
noconsole = True

# 圖標文件 (需要先創建 .ico 文件)
# icon = game_icon.ico

[Options]
# 額外包含的數據文件
# datas = src;src assets;assets

# 隱藏導入
hiddenimports = 
    pygame
    numpy
    pygame.sndarray
